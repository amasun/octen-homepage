    <line x1="18.9" y1="49.9" x2="21.56" y2="49.9" />
    <line x1="18.9" y1="93.2" x2="21.56" y2="93.2" />
    <line x1="18.9" y1="135.9" x2="21.56" y2="135.9" />
    <line x1="18.9" y1="179.2" x2="21.56" y2="179.2" />
    <line x1="18.9" y1="222.5" x2="21.56" y2="222.5" />
    <line x1="18.9" y1="265.8" x2="21.56" y2="265.8" />
  </g>

  <g font-family="'DM Mono', monospace" font-size="10" fill="#666666" text-anchor="end">
    <text x="15" y="10">82</text>
    <text x="15" y="53.5">80</text>
    <text x="15" y="96.5">78</text>
    <text x="15" y="139.5">76</text>
    <text x="15" y="182.5">74</text>
    <text x="15" y="226">72</text>
    <text x="15" y="269">70</text>
