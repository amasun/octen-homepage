  <text transform="rotate(-90)" x="-136" y="-14" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="12" fill="#222222">Artificial Analysis Search Index</text>
  <text x="339" y="306" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="12" fill="#222222">Cost per Task</text>

  <!-- 6. Pareto Frontier Line (Dashed) -->
  <path d="M 98.66 239.52 L 224.69 112.11 L 399.99 71.07 L 399.99 49.5" stroke="#555555" stroke-width="1.2" stroke-dasharray="4 4" fill="none" />

