  <g font-family="'DM Mono', monospace" font-size="10" fill="#666666" text-anchor="middle">
    <text x="21.56" y="282">$0.02</text>
    <text x="127.48" y="282">$0.04</text>
    <text x="233.40" y="282">$0.06</text>
    <text x="339.32" y="282">$0.08</text>
