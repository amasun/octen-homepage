    <text x="592" y="189" text-anchor="start" font-family="'DM Sans', sans-serif" font-size="12" fill="#6F6F6F">Exa (auto)</text>
  </g>

  <!-- Brave (LLM context) -->
  <g class="pareto-point">
    <circle cx="597.1" cy="165.0" r="3.5" fill="#797979" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="597" y="152" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="12" fill="#6F6F6F">Brave (LLM context)</text>
  </g>

  <!-- 8. Octen Highlight (Hero on Pareto Frontier) -->
  <g class="pareto-octen-group">
    <!-- Octen Brand Label Badge -->
    <g transform="translate(192.25, 86.42)">
      <image href="/images/benchmarks/octen-mark.svg" x="0" y="-1" width="18" height="15" />
      <text x="22" y="11" font-family="'DM Sans', sans-serif" font-weight="bold" font-size="14" fill="#039855" letter-spacing="-0.2px">Octen</text>
    </g>
    <!-- Glowing Outer Halo -->
    <circle cx="224.69" cy="112.11" r="7" fill="#039855" fill-opacity="0.25" />
    <!-- Solid Center Dot with White Ring -->
    <circle cx="224.69" cy="112.11" r="4" fill="#039855" stroke="#FFFFFF" stroke-width="1.5" />
