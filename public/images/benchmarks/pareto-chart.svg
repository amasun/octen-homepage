    <circle cx="532.3" cy="176.9" r="3.5" fill="#797979" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="524" y="171" text-anchor="end" font-family="'DM Sans', sans-serif" font-size="12" fill="#6F6F6F">You.com (highlights)</text>
