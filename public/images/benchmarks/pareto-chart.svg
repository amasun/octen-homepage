    <line x1="21.56" y1="265.8" x2="21.56" y2="269.4" />
    <line x1="127.48" y1="265.8" x2="127.48" y2="269.4" />
    <line x1="233.40" y1="265.8" x2="233.40" y2="269.4" />
    <line x1="339.32" y1="265.8" x2="339.32" y2="269.4" />
    <line x1="445.24" y1="265.8" x2="445.24" y2="269.4" />
    <line x1="551.15" y1="265.8" x2="551.15" y2="269.4" />
    <line x1="657.06" y1="265.8" x2="657.06" y2="269.4" />
