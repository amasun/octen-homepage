<svg viewBox="-32 -4 708 316" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" class="built-perf-pareto-svg">
  <defs>
    <!-- Filter for Octen glow -->
    <filter id="octen-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Most Attractive Quadrant Background -->
  <rect x="21.56" y="6.34" width="317.75" height="129.58" fill="#CAEBC5" fill-opacity="0.4" rx="2" />

