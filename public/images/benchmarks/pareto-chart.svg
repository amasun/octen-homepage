  <g stroke="#EEEEEE" stroke-width="0.7">
    <line x1="21.56" y1="6.6" x2="657.06" y2="6.6" />
    <line x1="21.56" y1="49.9" x2="657.06" y2="49.9" />
    <line x1="21.56" y1="93.2" x2="657.06" y2="93.2" />
    <line x1="21.56" y1="135.9" x2="657.06" y2="135.9" />
    <line x1="21.56" y1="179.2" x2="657.06" y2="179.2" />
    <line x1="21.56" y1="222.5" x2="657.06" y2="222.5" />
    <line x1="21.56" y1="265.8" x2="657.06" y2="265.8" />
  </g>

  <!-- 3. Y-Axis Ticks & Labels -->
