<!-- Floating top-left Vercel plan switcher (A = main, B = planB, C = planC) -->
<div class="octen-plan-switcher" id="octenPlanSwitcher" aria-label="Switch preview plan">
  <button
    type="button"
    class="octen-plan-trigger"
    id="octenPlanTrigger"
    aria-haspopup="true"
    aria-label="Current plan: A"
    title="Hover to switch plan (A / B / C)"
  >A</button>
  <div class="octen-plan-menu" role="menu">
    <div class="octen-plan-menu-inner">
      <a
        href="https://octen-homepage.vercel.app/"
        class="octen-plan-item is-active"
        data-plan="A"
        role="menuitem"
        title="Plan A · main"
      >A</a>
      <a
        href="https://octen-homepage-git-homepage-v2-planb-amasun007-8115s-projects.vercel.app/"
        class="octen-plan-item"
        data-plan="B"
        role="menuitem"
        title="Plan B · homepage-v2-planB"
      >B</a>
      <a
        href="https://octen-homepage-git-homepage-v2-planc-amasun007-8115s-projects.vercel.app/"
        class="octen-plan-item"
        data-plan="C"
        role="menuitem"
        title="Plan C · homepage-v2-planC"
      >C</a>
    </div>
  </div>
</div>

<style>
  .octen-plan-switcher {
    position: fixed;
    top: 33.33vh;
    left: 14px;
    z-index: 9999;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .octen-plan-trigger {
    width: 42px;
    height: 42px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(10, 10, 10, 0.12);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.16);
    color: #0a0a0a;
    font-size: 15px;
    font-weight: 700;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
  }
  .octen-plan-switcher:hover .octen-plan-trigger,
  .octen-plan-switcher:focus-within .octen-plan-trigger {
    border-color: rgba(10, 10, 10, 0.28);
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.22);
  }
  .octen-plan-menu {
    padding-top: 8px;
    opacity: 0;
    pointer-events: none;
    transform: translateY(-8px) scaleY(0.9);
    transform-origin: top center;
    transition: opacity 0.2s ease, transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .octen-plan-switcher:hover .octen-plan-menu,
  .octen-plan-switcher:focus-within .octen-plan-menu {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0) scaleY(1);
  }
  .octen-plan-menu-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    padding: 5px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(10, 10, 10, 0.12);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.18);
  }
  .octen-plan-item {
    width: 34px;
    height: 34px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    color: #3f3f46;
    text-decoration: none;
    transition: background-color 0.15s ease, color 0.15s ease;
  }
  .octen-plan-item:hover {
    background: #f4f4f5;
    color: #0a0a0a;
  }
  .octen-plan-item.is-active {
    background: #0a0a0a;
    color: #ffffff;
  }
</style>

<script>
  (function () {
    var host = (window.location && window.location.hostname || '').toLowerCase();
    var current = host.indexOf('planb') !== -1 ? 'B' : host.indexOf('planc') !== -1 ? 'C' : 'A';
    var trigger = document.getElementById('octenPlanTrigger');
    if (trigger) {
      trigger.textContent = current;
      trigger.setAttribute('aria-label', 'Current plan: ' + current);
    }
    var items = document.querySelectorAll('#octenPlanSwitcher .octen-plan-item');
    items.forEach(function (el) {
      el.classList.toggle('is-active', el.getAttribute('data-plan') === current);
    });
  })();
</script>
