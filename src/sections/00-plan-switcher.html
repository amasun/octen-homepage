<!-- Floating top-left Vercel plan switcher (A = main, B = planB, C = planC) -->
<div class="octen-plan-switcher" id="octenPlanSwitcher" aria-label="Switch preview plan">
  <button
    type="button"
    class="octen-plan-trigger"
    id="octenPlanTrigger"
    aria-haspopup="true"
    aria-label="Current plan: A"
    title="Hover to switch plan (A / B / C)"
  >A</button>
  <div class="octen-plan-menu" role="menu">
    <div class="octen-plan-menu-inner">
      <a
        href="https://octen-homepage.vercel.app/"
        class="octen-plan-item is-active"
        data-plan="A"
        role="menuitem"
        title="Plan A · main"
      >A</a>
      <a
        href="https://octen-homepage-git-homepage-v2-planb-amasun007-8115s-projects.vercel.app/"
        class="octen-plan-item"
        data-plan="B"
        role="menuitem"
        title="Plan B · homepage-v2-planB"
      >B</a>
      <a
        href="https://octen-homepage-git-homepage-v2-planc-amasun007-8115s-projects.vercel.app/"
        class="octen-plan-item"
        data-plan="C"
        role="menuitem"
        title="Plan C · homepage-v2-planC"
      >C</a>
    </div>
  </div>
</div>

<style>
  .octen-plan-switcher {
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 9999;
    display: inline-flex;
    align-items: center;
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .octen-plan-trigger {
    width: 32px;
    height: 32px;
    border-radius: 999px;
    background: rgba(12, 16, 23, 0.82);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.24);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28);
    color: #ffffff;
    font-size: 13px;
    font-weight: 700;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color 0.2s ease, transform 0.2s ease, background-color 0.2s ease;
  }
  .octen-plan-switcher:hover .octen-plan-trigger,
  .octen-plan-switcher:focus-within .octen-plan-trigger {
    border-color: rgba(24, 251, 111, 0.65);
    background: rgba(12, 16, 23, 0.94);
  }
  .octen-plan-menu {
    padding-left: 6px;
    opacity: 0;
    pointer-events: none;
    transform: translateX(-6px);
    transition: opacity 0.18s ease, transform 0.18s ease;
  }
  .octen-plan-switcher:hover .octen-plan-menu,
  .octen-plan-switcher:focus-within .octen-plan-menu {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(0);
  }
  .octen-plan-menu-inner {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px;
    border-radius: 999px;
    background: rgba(12, 16, 23, 0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.32);
  }
  .octen-plan-item {
    width: 26px;
    height: 26px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.78);
    text-decoration: none;
    transition: background-color 0.15s ease, color 0.15s ease;
  }
  .octen-plan-item:hover {
    background: rgba(255, 255, 255, 0.14);
    color: #ffffff;
  }
  .octen-plan-item.is-active {
    background: rgba(24, 251, 111, 0.18);
    color: #18FB6F;
    box-shadow: inset 0 0 0 1px rgba(24, 251, 111, 0.45);
  }
</style>

<script>
  (function () {
    var host = (window.location && window.location.hostname || '').toLowerCase();
    var current = host.indexOf('planb') !== -1 ? 'B' : host.indexOf('planc') !== -1 ? 'C' : 'A';
    var trigger = document.getElementById('octenPlanTrigger');
    if (trigger) {
      trigger.textContent = current;
      trigger.setAttribute('aria-label', 'Current plan: ' + current);
    }
    var items = document.querySelectorAll('#octenPlanSwitcher .octen-plan-item');
    items.forEach(function (el) {
      el.classList.toggle('is-active', el.getAttribute('data-plan') === current);
    });
  })();
</script>
