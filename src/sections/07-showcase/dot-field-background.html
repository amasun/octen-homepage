<!-- Decorative dot-field background (last child of div#hero). The final closing div tag closes div#hero, which is opened in 02-hero.html; keep it. -->
  <div class="absolute-center size-full z-0 opacity-25">
    <div class="dot-field-container">
      <canvas style="position: absolute; inset: 0; width: 100%; height: 100%"></canvas
      ><svg style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none">
        <defs>
          <radialGradient id="dot-field-glow">
            <stop offset="0%" stop-color="transparent"></stop>
            <stop offset="100%" stop-color="transparent"></stop>
          </radialGradient>
        </defs>
        <circle
          cx="-9999"
          cy="-9999"
          r="40"
          fill="url(#dot-field-glow)"
          style="opacity: 0; will-change: opacity"
        ></circle>
      </svg>
    </div>
  </div>
</div>
