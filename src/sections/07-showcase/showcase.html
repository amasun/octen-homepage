<!-- ================= SECTION 7: SHOWCASE → Try Octen in our applications =================
  五个 app 嵌套卡片:外层浅灰壳 + 内层图形卡(占位渐变 + 中央 app logo,logo 来自 Figma Octen_汇总 node 14304:38085,存于 /images/apps/)+ 底部名称行(名称 + 用到的 Octen 能力标签 .sc-tags)
  布局:横向滚动轨道。首卡左缘对齐 1280px 内容区,前四张正好铺满 1280,第五张自然排在右侧、突破 1280 限制;
  任何屏宽都可左右滑动(scroll-snap)。样式见 public/css/showcase-apps.css
  旧版 4 张动图卡片仍保留在 cards/ 目录,只是不再 include。
-->
<div class="relative w-full bg-white" id="showcase">
  <span id="built-on-octen" class="scroll-anchor" style="position: absolute; top: 0; left: 0;" aria-hidden="true"></span>
  <span id="applications" class="scroll-anchor" style="position: absolute; top: 0; left: 0;" aria-hidden="true"></span>

  <div class="sc-head">
    <span class="sc-head-pill" data-copy-anchor="#showcase">Showcase</span>
    <h2 class="font-serif text-gray-900 text-5xl lg:text-[44px]">Try Octen in our applications</h2>
    <!-- 左右切换按钮(≥768px 显示;小屏靠滑动)。逻辑见 public/js/showcase-apps.js -->
    <div class="sc-nav">
      <button type="button" class="sc-nav-btn" data-dir="-1" aria-label="Previous applications" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <button type="button" class="sc-nav-btn" data-dir="1" aria-label="Next applications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </div>
  </div>

  <div class="sc-apps" role="list">
    <a class="sc-app" role="listitem" href="#" aria-label="Answer">
      <div class="sc-banner sc-banner--answer">
        <span class="sc-icon" aria-hidden="true"><img src="/images/apps/answer.svg" class="is-inset" alt="" /></span>
      </div>
      <div class="sc-foot"><span class="sc-name">Answer</span>
        <ul class="sc-tags" aria-label="Octen capabilities used"><li>Broad Search</li></ul></div>
    </a>

    <a class="sc-app" role="listitem" href="#" aria-label="Search Agent">
      <div class="sc-banner sc-banner--agent">
        <span class="sc-icon" aria-hidden="true"><img src="/images/apps/search-agent.svg" alt="" /></span>
      </div>
      <div class="sc-foot"><span class="sc-name">Search Agent</span>
        <ul class="sc-tags" aria-label="Octen capabilities used"><li>Web Search</li><li>News Search</li></ul></div>
    </a>

    <a class="sc-app" role="listitem" href="#" aria-label="Deep Research">
      <div class="sc-banner sc-banner--research">
        <span class="sc-icon" aria-hidden="true"><img src="/images/apps/deep-research.svg" alt="" /></span>
      </div>
      <div class="sc-foot"><span class="sc-name">Deep Research</span>
        <ul class="sc-tags" aria-label="Octen capabilities used"><li>Web Search</li><li>Image Search</li><li>Video Search</li></ul></div>
    </a>

    <a class="sc-app" role="listitem" href="#" aria-label="Grounded Generation">
      <div class="sc-banner sc-banner--grounded">
        <span class="sc-icon" aria-hidden="true"><img src="/images/apps/grounded-generation.svg" class="is-inset" alt="" /></span>
      </div>
      <div class="sc-foot"><span class="sc-name">Grounded Generation</span>
        <ul class="sc-tags" aria-label="Octen capabilities used"><li>Image Search</li><li>Video Search</li></ul></div>
    </a>

    <a class="sc-app" role="listitem" href="#" aria-label="Auto Search">
      <div class="sc-banner sc-banner--auto">
        <span class="sc-icon" aria-hidden="true"><img src="/images/apps/auto-search.svg" alt="" /></span>
      </div>
      <div class="sc-foot"><span class="sc-name">Auto Search</span>
        <ul class="sc-tags" aria-label="Octen capabilities used"><li>Model Gateway</li></ul></div>
    </a>
  </div>
</div>
