<!-- Floating Option 1 / Option 2 switcher for the Built to Perform slot (#perfOptions). Hidden until the slot is on screen. -->
<div class="perf-switcher" id="perfSwitcher" aria-hidden="true">
  <span class="perf-switcher-label">Performance</span>
  <div class="perf-switcher-seg" role="radiogroup" aria-label="Performance layout">
    <button type="button" class="perf-switcher-btn is-active" role="radio" aria-checked="true" data-perf-switch="1">Option 1</button>
    <button type="button" class="perf-switcher-btn" role="radio" aria-checked="false" data-perf-switch="2">Option 2</button>
  </div>
</div>
<script src="/js/perf-option-switcher.js"></script>
