<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>shine-word demo</title>
<link rel="stylesheet" href="./shine-word.css">
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.170.0/build/three.module.js" } }</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; color: #343438;
         font: 500 40px/1.3 -apple-system, "Inter", "PingFang SC", sans-serif; }
  body.dark { background: #0b0b0d; color: #f2f2f2; }
  button { position: fixed; top: 16px; right: 16px; font: 14px sans-serif; padding: 6px 12px; }
</style>
</head>
<body class="dark">
<button onclick="document.body.classList.toggle('dark')">light / dark</button>
<p>加入，并亲手打造下一家<span id="word"></span></p>
<script type="module">
  import { ShineWord } from './shine-word.js';
  new ShineWord(document.getElementById('word'), { words: [' Airbnb', ' SpaceX', ' Stripe', ' OpenAI', ' Octen'] });
</script>
</body>
</html>
